name: driving-school-supabase-test
services:
  db:
    image: supabase/postgres:17.6.1.136
    restart: "no"
    command: ["postgres", "-D", "/etc/postgresql", "-c", "listen_addresses=*"]
    environment:
      POSTGRES_USER: supabase_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?required}
    volumes:
      - test_postgres_data:/var/lib/postgresql/data
      - /opt/backups/supabase/cloud-backup.dump:/backup/cloud-backup.dump:ro
    networks: [test_internal]
    mem_limit: 1024m
    pids_limit: 256
    security_opt: [no-new-privileges:true]
  auth:
    image: supabase/gotrue:v2.196.0
    restart: "no"
    depends_on: [db, mailpit]
    environment:
      GOTRUE_API_HOST: "0.0.0.0"
      GOTRUE_API_PORT: "9999"
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${TEST_POSTGRES_PASSWORD:?required}@db:5432/postgres
      GOTRUE_SITE_URL: http://localhost:18080
      API_EXTERNAL_URL: http://localhost:19999
      GOTRUE_JWT_SECRET: ${TEST_JWT_SECRET:?required}
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_SMTP_ADMIN_EMAIL: "admin@test.local"
      GOTRUE_SMTP_FROM: "auth@test.local"
      GOTRUE_SMTP_HOST: "mailpit"
      GOTRUE_SMTP_PORT: "1025"
    networks: [test_internal]
    security_opt: [no-new-privileges:true]
  # Локальный доступ к API: у контейнеров в internal-сети Docker НЕ публикует
  # порты на хост, поэтому каждый сервис публикуется через dual-homed socat-прокси
  # (test_internal + test_edge). Публикуется только на 127.0.0.1 сервера.
  auth-local:
    image: alpine/socat:latest
    restart: "no"
    command: TCP-LISTEN:9999,fork,reuseaddr TCP:auth:9999
    ports:
      - "127.0.0.1:19999:9999"
    networks: [test_internal, test_edge]
    security_opt: [no-new-privileges:true]
  rest-local:
    image: alpine/socat:latest
    restart: "no"
    command: TCP-LISTEN:3000,fork,reuseaddr TCP:rest:3000
    ports:
      - "127.0.0.1:18080:3000"
    networks: [test_internal, test_edge]
    security_opt: [no-new-privileges:true]
  rest:
    image: postgrest/postgrest:v14.17
    restart: "no"
    depends_on: [db]
    environment:
      PGRST_DB_URI: postgres://authenticator:${TEST_POSTGRES_PASSWORD:?required}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${TEST_JWT_SECRET:?required}
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_DB_MAX_ROWS: "1000"
    networks: [test_internal]
    security_opt: [no-new-privileges:true]
  mailpit:
    image: axllent/mailpit:latest
    restart: "no"
    # Ловушка писем: SMTP внутри тестовой сети, письма наружу не уходят
    # (сеть internal, у mailpit нет внешнего SMTP-апстрима).
    networks: [test_internal]
    security_opt: [no-new-privileges:true]
  mailpit-local:
    image: alpine/socat:latest
    restart: "no"
    command: TCP-LISTEN:8025,fork,reuseaddr TCP:mailpit:8025
    ports:
      - "127.0.0.1:18025:8025"
    networks: [test_internal, test_edge]
    security_opt: [no-new-privileges:true]
  storage:
    image: supabase/storage-api:v1.74.0
    restart: "no"
    depends_on: [db, rest]
    environment:
      ANON_KEY: ${TEST_ANON_KEY:?required}
      SERVICE_KEY: ${TEST_SERVICE_ROLE_KEY:?required}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${TEST_JWT_SECRET:?required}
      JWT_SECRET: ${TEST_JWT_SECRET:?required}
      DATABASE_URL: postgres://supabase_storage_admin:${TEST_POSTGRES_PASSWORD:?required}@db:5432/postgres
      FILE_SIZE_LIMIT: "52428800"
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: "false"
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
    volumes:
      - test_storage_data:/var/lib/storage
    networks: [test_internal]
    security_opt: [no-new-privileges:true]
  # Realtime: события БД через WebSocket. Tenant seed'ится сам (SEED_SELF_HOST).
  realtime:
    image: supabase/realtime:v2.134.10
    restart: "no"
    depends_on: [db]
    environment:
      PORT: "4000"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: supabase_admin
      DB_PASSWORD: ${TEST_POSTGRES_PASSWORD:?required}
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: 'SET search_path TO _realtime'
      DB_ENC_KEY: ${TEST_REALTIME_ENC_KEY:?required}
      API_JWT_SECRET: ${TEST_JWT_SECRET:?required}
      API_JWT_JWKS: '{"keys":[]}'
      SECRET_KEY_BASE: ${TEST_SECRET_KEY_BASE:?required}
      METRICS_JWT_SECRET: ${TEST_JWT_SECRET:?required}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
      DISABLE_HEALTHCHECK_LOGGING: "true"
    networks: [test_internal]
    security_opt: [no-new-privileges:true]
  # Edge Functions: stock main-роутер + функции автошколы. Авторизация —
  # внутри каждой функции (production тоже FUNCTIONS_VERIFY_JWT=false).
  # SUPABASE_URL ведёт на gateway: функции ходят в auth/rest/storage стека.
  functions:
    image: supabase/edge-runtime:v1.76.2
    restart: "no"
    depends_on: [db, rest]
    environment:
      JWT_SECRET: ${TEST_JWT_SECRET:?required}
      SUPABASE_JWKS: '{"keys":[]}'
      SUPABASE_URL: http://gateway:8080
      SUPABASE_PUBLIC_URL: ${TEST_SUPABASE_PUBLIC_URL:-http://127.0.0.1:28000}
      SUPABASE_ANON_KEY: ${TEST_ANON_KEY:?required}
      SUPABASE_SERVICE_ROLE_KEY: ${TEST_SERVICE_ROLE_KEY:?required}
      # Новые opaque-режимы @supabase/server: без них любой запрос 500.
      SUPABASE_PUBLISHABLE_KEYS: "{\"default\":\"${TEST_ANON_KEY}\"}"
      SUPABASE_SECRET_KEYS: "{\"default\":\"${TEST_SERVICE_ROLE_KEY}\"}"
      SUPABASE_DB_URL: postgres://postgres:${TEST_POSTGRES_PASSWORD:?required}@db:5432/postgres
      VERIFY_JWT: "false"
      FUNCTIONS_CORS_ORIGIN: ${TEST_FUNCTIONS_CORS_ORIGIN:-https://test.dvizh-school.ru}
      # OneSignal в тесте — заглушки: реальных пушей не отправляется,
      # механика функций проверяется по отказу внешнего API.
      ONESIGNAL_APP_ID: ${TEST_ONESIGNAL_APP_ID:-test-app-id}
      ONESIGNAL_REST_API_KEY: ${TEST_ONESIGNAL_REST_API_KEY:-test-rest-key}
      DRIVING_REMINDER_SECRET: ${TEST_DRIVING_REMINDER_SECRET:?required}
      ONESIGNAL_EVENT_STREAM_SECRET: ${TEST_ONESIGNAL_EVENT_STREAM_SECRET:?required}
    volumes:
      - ./functions:/home/deno/functions:ro
      - test_deno_cache:/root/.cache/deno
    # Исключение из изоляции: edge-runtime при каждом старте ревалидирует
    # JSR-манифесты по сети (deno-кэш не решает), production-стек тоже
    # имеет интернет. Секреты тестовые, OneSignal — заглушки (реальных
    # пушей нет), сервисы данных остаются в test_internal.
    networks: [test_internal, test_edge]
    security_opt: [no-new-privileges:true]
    command: ["start", "--main-service", "/home/deno/functions/main"]
  # Единая точка входа: /auth/v1 → GoTrue, /rest/v1 → PostgREST,
  # /storage/v1 → Storage API, /realtime/v1 → Realtime (WebSocket upgrade).
  gateway:
    image: nginx:alpine
    restart: "no"
    depends_on: [auth, rest, storage, realtime, functions]
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [test_internal]
    security_opt: [no-new-privileges:true]
  gateway-local:
    image: alpine/socat:latest
    restart: "no"
    command: TCP-LISTEN:8080,fork,reuseaddr TCP:gateway:8080
    ports:
      - "127.0.0.1:28000:8080"
    networks: [test_internal, test_edge]
    security_opt: [no-new-privileges:true]
networks:
  test_internal:
    internal: true
  test_edge: {}
volumes:
  test_postgres_data:
  test_storage_data:
  test_deno_cache:
