# CORS повторяет production (Envoy lds.template.yaml, основной API-vhost):
# точный origin вместо "*", без credentials, методы без CONNECT/TRACE.
# Origin'ы: собственные адреса dvizh-school.ru по HTTPS + localhost для
# разработки. Чужой Origin не получает Access-Control-Allow-Origin вообще.
map $http_origin $cors_origin {
    default "";
    "~^https://([a-z0-9-]+\.)*dvizh\-school\.ru$" $http_origin;
    "~^http://(localhost|127\.0\.0\.1)(:[0-9]+)?$" $http_origin;
}

server {
    listen 8080;
    server_name _;

    client_max_body_size 50m;

    proxy_http_version 1.1;

    # Значение из map пустое для неразрешённого Origin -> nginx не выставляет заголовок.
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Expose-Headers * always;
    add_header Vary Origin always;

    location /auth/v1/ {
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Expose-Headers;
        if ($request_method = OPTIONS) {
            # add_header внутри if отменяет наследование серверных заголовков,
            # поэтому ACAO/Vary продублированы здесь.
            add_header Access-Control-Allow-Origin $cors_origin;
            add_header Access-Control-Expose-Headers *;
            add_header Vary Origin;
            add_header Access-Control-Allow-Methods 'GET,POST,PUT,PATCH,DELETE,OPTIONS,HEAD';
            add_header Access-Control-Allow-Headers $http_access_control_request_headers;
            add_header Access-Control-Max-Age 3600;
            return 200;
        }
        proxy_pass http://auth:9999/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location /rest/v1/ {
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Expose-Headers;
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin;
            add_header Access-Control-Expose-Headers *;
            add_header Vary Origin;
            add_header Access-Control-Allow-Methods 'GET,POST,PUT,PATCH,DELETE,OPTIONS,HEAD';
            add_header Access-Control-Allow-Headers $http_access_control_request_headers;
            add_header Access-Control-Max-Age 3600;
            return 200;
        }
        proxy_pass http://rest:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /storage/v1/ {
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Expose-Headers;
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin;
            add_header Access-Control-Expose-Headers *;
            add_header Vary Origin;
            add_header Access-Control-Allow-Methods 'GET,POST,PUT,PATCH,DELETE,OPTIONS,HEAD';
            add_header Access-Control-Allow-Headers $http_access_control_request_headers;
            add_header Access-Control-Max-Age 3600;
            return 200;
        }
        proxy_pass http://storage:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        return 404;
    }
}
